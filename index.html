<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <p>68070136</p>
        <h2>ITF Website</h2>
        <p>Week 14</p>
    </nav>
    <div class="title">
        <img src="https://th.portal-pokemon.com/play/resources/pokedex/img/pm/47549471dc54feb8acd4b3de3a27ea8e9e9fd25c.png" alt="logo" class="logo">
        <h1>ITF Simple Bank</h1>
        <p>Welcome to my first HTML + CSS + JS website!</p>
    </div>
    <div class="status-box"></div>
    <div class="container">
        <div class="box">
        <h2>Account Overview</h2>
        <h3>Account Information</h3>
        <p>Name: Teepada Chuenprempree</p>
        <p>Type: Savings Account</p>

        <h3>Balance Information</h3>
        <label>Current account balance:</label>
        <input type="text" value="0" id="account"><br>
        <label>Current cash balance:</label>
        <input type="text" value="0" id="cash"><br>
        <button>Change</button>

        <h3>Bank Operation</h3>
        <select id="operationType">
            <option value="deposit">Deposit</option>
            <option value="withdraw">Withdraw</option>
        </select>
        <input type="number" placeholder="Amount" id="amount">
        <span id="amountError" style="color:red; font-size:12px;"></span><br>
        <button onclick="operation()">Proceed</button>

    </div>
    <div class="box">
        <h2>Financial Tools</h2>
        <h3>Currency Converter</h3>
        <label>Input balance:</label>
        <input type="number" value="0"><br>
        <label>Output balance:</label>
        <input type="number" value="0"><br>
        <label>Input currency:</label>
        <select>
            <option>USD</option>
            <option>THB</option>
        </select>
        <button>Convert</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
